name: Build, test and deploy FlyingFree
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flyingfree-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: Build for Pages
        run: npm run build
      - name: Install Chromium for visual regression smoke test
        run: npx playwright install --with-deps chromium
      - name: Validate real browser render and controls
        run: npm run test:browser
      - name: Save browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyingfree-production-visual-qa
          path: artifacts/visual/
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
