name: Build, test and deploy FlyingFree
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flyingfree-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: VE-03 geometry and query benchmark
        run: npm run benchmark:world-query
      - name: Upload BVH accuracy and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-query-benchmark
          path: artifacts/world-query/
          if-no-files-found: warn
      - name: Build for Pages
        run: npm run build
      - name: Install Chromium for visual regression smoke test
        run: npx playwright install --with-deps chromium
      - name: Validate real browser render and controls
        run: npm run test:browser
      - name: Save browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyingfree-production-visual-qa
          path: artifacts/visual/
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published main commit
        shell: bash
        timeout-minutes: 6
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          for attempt in $(seq 1 24); do
            endpoint="${PUBLIC_URL%/}/build-info.json?revision=${EXPECTED_SHA}&attempt=${attempt}"
            actual=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$endpoint" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))' 2>/dev/null || true)
            if [[ "$actual" == "$EXPECTED_SHA" ]]; then
              echo "Published Pages SHA verified: $EXPECTED_SHA"
              exit 0
            fi
            echo "Published SHA not yet synchronized (attempt $attempt/24): ${actual:-unavailable}"
            sleep 10
          done
          echo "::error::GitHub Pages does not serve expected SHA $EXPECTED_SHA"
          exit 1
