name: Visual and browser QA
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Core tests
        run: npm test
      - name: VE-03 geometry and query benchmark
        run: npm run benchmark:world-query
      - name: Upload BVH accuracy and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-query-benchmark
          path: artifacts/world-query/
          if-no-files-found: warn
      - name: VE-04 selective Rapier CPU and contact benchmark
        run: npm run benchmark:physics
      - name: Upload VE-04 CPU and memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-physics-benchmark
          path: artifacts/physics/
          if-no-files-found: warn
      - name: Production build
        run: npm run build
      - name: Preserve VE-05 generated models and geometry metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ve05-kingfisher-glb-evidence
          path: |
            public/assets/birds/*.glb
            public/assets/birds/manifest.json
            artifacts/assets/geometry.json
          if-no-files-found: warn
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test interactions, WebGL and visual output
        run: npm run test:browser
      - name: Store screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyingfree-visual-evidence
          path: artifacts/visual/
          if-no-files-found: warn
